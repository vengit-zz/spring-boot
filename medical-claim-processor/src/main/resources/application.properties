# ============================================================
# Medical Claim Processor — Application Configuration
# ============================================================

spring.application.name=medical-claim-processor
server.port=8080

# Anthropic API key
# Prefer the ANTHROPIC_API_KEY environment variable.
# This property is used as a fallback only.
anthropic.api-key=${ANTHROPIC_API_KEY:}

# Allow larger request bodies for base64-encoded receipt images (e.g. ~5 MB)
spring.mvc.async.request-timeout=120000
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.max-file-size=10MB

# Logging
logging.level.com.example.medicalclaim=INFO
logging.level.com.anthropic=WARN
